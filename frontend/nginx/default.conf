# SPA + reverse proxy (SPEC-11 §1–2). Adapted from Private Repo App frontend/nginx/: upstream is api:8000,
# chat is server-sent events, no WebSocket hubs or public links.

log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # $uri has no query string, so search text and filters never reach the access log.
    access_log /var/log/nginx/access.log safe;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Above MAX_UPLOAD_MB (25) so the API, not nginx, answers an oversized upload with its own 413.
    client_max_body_size 30m;

    # Chat answers stream as SSE: no buffering, no gzip, long reads (the API pings every 15 s).
    location = /api/v1/chat {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # Uploads stream straight to the API, which enforces the size limit.
    location = /api/v1/documents {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location = /health {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Connection "";
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# Full stack (SPEC-11 §1): `docker compose up -d --build` → http://localhost:8080.
# Local dev runs only Postgres here: `docker compose up -d postgres`.
# Public preview: `docker compose --profile public up -d --build` adds the Cloudflare tunnel (SPEC-11 §5).
# All host ports bind to loopback. Config comes from `.env`; nothing secret is baked into an image.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ./backend, target: api }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      STORAGE_DIR: /data/storage
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: ./backend, target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      STORAGE_DIR: /data/storage
      # The image's baked models; a host value in .env must not point the worker elsewhere.
      DOCLING_ARTIFACTS_PATH: /models/docling
      HF_HUB_OFFLINE: "1"
    volumes:
      - storage:/data/storage
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build: { context: ./frontend }
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: { condition: service_healthy }

  # Public preview (SPEC-11 §5, M100): `docker compose --profile public up -d`.
  # Remotely managed tunnel: the dashboard maps the public hostname to http://frontend:80.
  # Only TUNNEL_TOKEN is passed (no env_file), so cloudflared never sees the app's secrets. No host port.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    profiles: [public]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  pgdata:
  storage:
